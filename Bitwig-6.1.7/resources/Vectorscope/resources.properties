module.vectorscope.desc=Plots two Grid signals or a stereo pair as an XY trace with a fading, colored phosphor trail.
vectorscope.display.title=XY Display
vectorscope.display.desc=Equal signals draw a rising diagonal. Opposite polarity draws a falling diagonal. Two equal sines a quarter cycle apart draw a circle.
vectorscope.x.title=X / Stereo In
vectorscope.x.desc=Sets the horizontal position. With Stereo Input enabled, the left and right channels on this port supply X and Y.
vectorscope.y.title=Y
vectorscope.y.desc=Sets the vertical position in XY mode. Stereo Input reads Y from the right channel of X instead.
vectorscope.hue.title=Hue
vectorscope.hue.desc=Cycles the beam color with a 0 to 1 signal. Unpatched is green. The phosphor remembers and mixes colors as the beam traces new positions.
vectorscope.thru.title=Stereo Thru
vectorscope.thru.desc=Passes the plotted axes as a stereo pair, with X on the left and Y on the right.
vectorscope.persistence.title=Persistence
vectorscope.persistence.desc=Sets the time span of the sharp XY trace, from 2 to 40 ms. Shorter spans keep fast signals easier to follow.
vectorscope.motion_blur.title=Motion Blur
vectorscope.motion_blur.desc=Sets how long the colored glow from earlier positions fades, from 0 to 10 seconds. Set it to zero for the sharp trace alone.
vectorscope.stereo_input.title=Stereo Input
vectorscope.stereo_input.desc=Use X's left and right channels for both axes. Turn this off to feed the axes from separate jacks.
vectorscope.stretch.title=Stretch
vectorscope.stretch.desc=Fills the panel by scaling the axes separately. Turn this off to keep equal axis scales when resizing.
