module.sonogram.desc=Shows the frequency content of a stereo signal as a scrolling spectrogram, from 20 Hz to 20 kHz.
sonogram.display.title=Spectrogram
sonogram.display.desc=Low frequencies appear at the bottom. New sound enters on the right, and brighter colors indicate more energy. The guide lines mark 100 Hz and 1 kHz.
sonogram.stereo_in.title=Stereo In
sonogram.stereo_in.desc=Patch in the signal to analyze. Each band shows the stronger stereo channel, so opposite polarity does not cancel.
sonogram.stereo_thru.title=Stereo Thru
sonogram.stereo_thru.desc=Passes both input channels through at their original levels and timing.
sonogram.time_window.title=Time Window
sonogram.time_window.desc=Sets how much history the 48 columns show, from 0.75 to 6 seconds. Shorter windows show finer timing.
sonogram.high_resolution.title=High Resolution
sonogram.high_resolution.desc=Uses a longer FFT in the bass bands to separate nearby frequencies in the conventional display.
sonogram.reassignment.title=Reassignment
sonogram.reassignment.desc=Moves spectral energy toward its estimated time and frequency. This can sharpen short sounds and narrow tones, with about one analysis window of display delay.
